spring.application.name=campus-notification-service

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/campus_notification_db
spring.datasource.username=root
spring.datasource.password=Yash@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
